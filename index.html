<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD - Activity Overview</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="script.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .hm { --cell: 13px; --gap: 3px; --empty: #ebedf0; font-family: sans-serif; }
    .hm-wrap { display: flex; gap: 6px; }
    .hm-weekdays { display: grid; grid-template-rows: repeat(7, var(--cell)); gap: var(--gap);
      font-size: 9px; line-height: var(--cell); color: #9ca3af; }
    .hm-scroll { overflow-x: auto; padding-bottom: 4px; }
    .hm-months { display: grid; grid-auto-flow: column; height: 13px; margin-bottom: 3px;
      font-size: 10px; color: #9ca3af; }
    .hm-months span { white-space: nowrap; }
    .hm-grid { display: grid; grid-template-rows: repeat(7, var(--cell));
      grid-auto-flow: column; gap: var(--gap); }
    .hm-cell { width: var(--cell); height: var(--cell); border-radius: 2px; background: none; }
    .hm-cell.filled { outline: 1px solid rgba(27,31,35,0.06); outline-offset: -1px; }
    .hm-mega { position: relative; z-index: 1; background: #fde047; }
    /* legend */
    .hm-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      margin-top: 12px; font-size: 12px; color: #6b7280; }
    .hm-legend .item { display: flex; align-items: center; gap: 5px; }
    .hm-legend .sw { width: 13px; height: 13px; border-radius: 2px; display: inline-block;
      outline: 1px solid rgba(27,31,35,0.06); outline-offset: -1px; }
    .hm-count { font-weight: 700; color: #ea580c; }

    .hm-mega, .hm-legend .sw.mega { animation: mega-flicker 0.9s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .hm-mega, .hm-legend .sw.mega { animation: none; box-shadow: 0 0 6px 2px rgba(249,115,22,0.9); }
    }
    @keyframes mega-flicker {
      0%   { background: #fde047; transform: scale(1);    box-shadow: 0 0 4px 1px rgba(249,115,22,0.75); }
      25%  { background: #ffffff; transform: scale(1.28); box-shadow: 0 0 12px 4px rgba(253,224,71,1), 0 0 22px 8px rgba(249,115,22,0.85); }
      50%  { background: #fb923c; transform: scale(1.05); box-shadow: 0 0 6px 2px rgba(239,68,68,0.9); }
      75%  { background: #fff7cc; transform: scale(1.32); box-shadow: 0 0 14px 5px rgba(255,255,255,0.95), 0 0 26px 10px rgba(249,115,22,0.8); }
      100% { background: #fde047; transform: scale(1);    box-shadow: 0 0 4px 1px rgba(249,115,22,0.75); }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6 text-center">MD - Activity Overview</h1>
    <h1 class="text-2xl font-bold mb-6 text-center">Monthly</h1>
    <canvas id="activityChart" class="bg-white rounded-lg shadow p-4"></canvas>
    <br>
    <h1 class="text-2xl font-bold mb-6 text-center">Yearly Summary</h1>
    <canvas id="activityChartYearly" class="bg-white rounded-lg shadow p-4"></canvas>
    <br>
<!--
    <h1 class="text-2xl font-bold mb-6 text-center">Total Summary</h1>
    <canvas id="activityChartTotal" class="bg-white rounded-lg shadow p-4"></canvas>
    <br>
-->
      <!-- % of yearly goal - how much is 2026 run value of target 600-->
    <h1 class="text-2xl font-bold mb-4 text-center">Yearly Goals</h1>
    <ul id="yearlyGoals" class="space-y-2"></ul>
    <br>
    <h1 class="text-2xl font-bold mb-6 text-center">Active Calories</h1>
    <div id="caloriesHeatmap" class="bg-white rounded-lg shadow p-4"></div>
    <br>
    <p class="text-center italic my-16">Quam longe pro victoria ibis?</p>
    <br>
  </div>
</body>
</html>
